# Menjalankan database PostgreSQL untuk pengembangan.
# Aplikasi FastAPI dijalankan langsung dari terminal (lihat README.md).
services:
  db:
    image: postgres:16
    container_name: freshsense-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - freshsense_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  freshsense_pgdata:
