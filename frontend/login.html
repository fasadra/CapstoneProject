<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FRESHSENSE AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="page-auth">
  <main class="auth-card">

    <section class="visual" style="background-image:url('img/buah.png')">
      <div class="brand-in"><img src="img/logofreshsenseai.png" alt=""><span>FRESHSENSE AI</span></div>
      <p class="tagline">Smart Guidance System Checks the Freshness of Your Fruit</p>
    </section>

    <section class="form-wrap">
      <p class="mobile-brand"><img src="img/logofreshsenseai.png" alt=""><span>FRESHSENSE AI</span></p>
      <h1>Login</h1>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email<span class="req">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nama@email.com" aria-describedby="email-err">
          <p id="email-err" class="err" aria-live="polite"></p>
        </div>

        <div class="field has-forgot">
          <label for="password">Password<span class="req">*</span></label>
          <div class="pw">
            <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-err">
            <button type="button" class="toggle" data-toggle="password" aria-label="Tampilkan kata sandi">
              <svg class="eye hidden" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="eye-off" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.1 10.1 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 4.1-5M9.9 5.1A9.7 9.7 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>
          <p id="password-err" class="err" aria-live="polite"></p>
          <a href="#" class="forgot">Lupa Password?</a>
        </div>

        <button type="submit" class="btn">Login</button>
        <p id="status" class="status" aria-live="polite"></p>
        <p class="switch">Belum punya akun? <a href="register.html">Daftar disini</a></p>
      </form>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
